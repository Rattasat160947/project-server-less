services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-main
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:8080"
      - "50000:50000"
    volumes:
      - project-server-less_jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false -Dhudson.model.DirectoryBrowserSupport.CSP=
    restart: always

volumes:
  project-server-less_jenkins_home:
    external: true