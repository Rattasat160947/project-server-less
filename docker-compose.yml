services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins-main
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "80:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

volumes:
  jenkins_home: