global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: frontend_metrics
    static_configs:
      # แก้จาก kost เป็น host เพื่อให้ชี้กลับมาที่เครื่องเราได้ถูกต้อง
      - targets: ["host.docker.internal:30300"]
  - job_name: 'node_metrics'
    static_configs:
      - targets: ["host.docker.internal:9100"]
    
rule_files:
  - "alert_rules.yml"