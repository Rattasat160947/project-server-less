global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_metrics'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'frontend_metrics'
    static_configs:
      - targets: ['host.docker.internal:30300']

  - job_name: 'backend_app'
    static_configs:
      - targets: ['host.docker.internal:8080']