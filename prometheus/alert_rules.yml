groups:
  - name: app_alerts
    rules:
      # 1. แจ้งเตือนเมื่อ Service ล่ม (Down)
      - alert: InstanceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} down"
          description: "Service {{ $labels.job }} ล่มมานานกว่า 1 นาทีแล้ว"

      # 2. แจ้งเตือนเมื่อมีการ Check-in (ตัวอย่างการใช้ Rate)
      - alert: HighCheckinRate
        expr: rate(frontend_checkins_total[1m]) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High Check-in rate"
          description: "มีการกด Check-in มากกว่า 5 ครั้งต่อนาที"