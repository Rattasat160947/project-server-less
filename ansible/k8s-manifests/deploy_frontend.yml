---
- name: Deploy Frontend on Kubernetes
  hosts: all
  tasks:
    - name: Deploy Frontend Deployment
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: frontend
            namespace: web-app
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: frontend
            template:
              metadata:
                labels:
                  app: frontend
              spec:
                containers:
                - name: frontend
                  image: "{{ docker_user }}/server-frontend:{{ version }}"
                  ports:
                  - containerPort: 80
                  env:
                    - name: BACKEND_URL
                      value: "http://backend-service:8080"
---
    - name: Create Frontend Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: frontend-service
            namespace: web-app
          spec:
            type: NodePort
            selector:
              app: frontend
            ports:
            - port: 80
              targetPort: 80
              nodePort: 30300