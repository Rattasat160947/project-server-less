---
- name: Deploy Backend on Kubernetes
  hosts: all
  tasks:
    - name: Create web-app namespace
      kubernetes.core.k8s:
        name: web-app
        api_version: v1
        kind: Namespace
        state: present

    - name: Deploy Backend Service and Deployment
      kubernetes.core.k8s:
        state: present
        definition:
          # --- ส่วนของ Deployment ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: backend
            namespace: web-app
          spec:
            replicas: 1
            strategy:
              type: Recreate  # เพิ่มส่วนนี้เพื่อให้ SQLite ไม่โดน Lock ตอน Update
            selector:
              matchLabels:
                app: backend
            template:
              metadata:
                labels:
                  app: backend
              spec:
                containers:
                - name: backend
                  # ใช้ตัวแปรที่ส่งมาจาก Jenkinsfile
                  image: "{{ docker_user }}/server-backend:{{ version }}"
                  imagePullPolicy: Always
                  ports:
                  - containerPort: 8080
                  env:
                    - name: DB_PATH
                      value: "/app/data/app.db"
                  volumeMounts:
                    - name: sqlite-storage
                      mountPath: /app/data
                      
                # -- เพิ่ม Sidecar เข้ามาเพื่ออ่านพื้นที่ฮาร์ดดิสก์ เฉพาะจุดนี้ (ปลอดภัย 100% ต่อให้อันนี้พัง Backend ก็ไม่ร่วง) --
                - name: storage-exporter
                  image: prom/node-exporter:latest
                  args:
                    - "--path.rootfs=/host"
                  ports:
                    - containerPort: 9100
                  volumeMounts:
                    - name: sqlite-storage
                      mountPath: /host/app/data
                      readOnly: true
                # --------------------------------------------------------------------------------------
                
                volumes:
                  - name: sqlite-storage
                    persistentVolumeClaim:
                      claimName: sqlite-pvc

    # -- สร้าง Service ช่องทางพิเศษเพื่อดึง Metric ออกไปที่ภายนอก k8s (Prometheus) --
    - name: Create Backend Metrics Exporter Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: backend-metrics-service
            namespace: web-app
          spec:
            type: NodePort
            selector:
              app: backend
            ports:
            - port: 9100
              targetPort: 9100
              nodePort: 30301
    # ------------------------------------------------------------------------

    - name: Create Backend Service
      kubernetes.core.k8s:
        state: present
        definition:
          # --- ส่วนของ Service ---
          apiVersion: v1
          kind: Service
          metadata:
            name: backend-service
            namespace: web-app
          spec:
            selector:
              app: backend
            ports:
            - port: 8080
              targetPort: 8080